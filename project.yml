name: ChargeGuard
options:
  bundleIdPrefix: dev.byrvr
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: "YES"

targets:
  ChargeGuardHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Shared
    settings:
      base:
        PRODUCT_NAME: ChargeGuardHelper
        PRODUCT_BUNDLE_IDENTIFIER: dev.byrvr.ChargeGuard.helper
        SWIFT_OBJC_BRIDGING_HEADER: Helper/BridgingHeader.h

  ChargeGuardHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - main.swift
      - Shared
      - Tests
    settings:
      base:
        PRODUCT_NAME: ChargeGuardHelperTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.byrvr.ChargeGuard.helperTests
        SWIFT_OBJC_BRIDGING_HEADER: Helper/BridgingHeader.h
        GENERATE_INFOPLIST_FILE: "YES"

  ChargeGuard:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChargeGuard
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License — github.com/byrvr/chargeguard"
        CFBundleIconName: AppIcon
    dependencies:
      - target: ChargeGuardHelper
        embed: false
    postBuildScripts:
      - name: Embed Privileged Helper
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Library/LaunchDaemons" "${APP}/Contents/Resources"
          cp "${BUILT_PRODUCTS_DIR}/ChargeGuardHelper" "${APP}/Contents/MacOS/"
          cp "${SRCROOT}/Config/dev.byrvr.ChargeGuard.helper.plist" \
             "${APP}/Contents/Library/LaunchDaemons/"
          cp "${SRCROOT}/scripts/install-daemon.sh" "${SRCROOT}/scripts/uninstall-daemon.sh" \
             "${APP}/Contents/Resources/"
          chmod +x "${APP}/Contents/Resources/install-daemon.sh" "${APP}/Contents/Resources/uninstall-daemon.sh"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/ChargeGuardHelper
          - $(SRCROOT)/Config/dev.byrvr.ChargeGuard.helper.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/MacOS/ChargeGuardHelper
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Library/LaunchDaemons/dev.byrvr.ChargeGuard.helper.plist

schemes:
  ChargeGuard:
    build:
      targets:
        ChargeGuard: all
    run:
      config: Debug
  ChargeGuardHelperTests:
    build:
      targets:
        ChargeGuardHelperTests: [test]
    test:
      targets:
        - ChargeGuardHelperTests
